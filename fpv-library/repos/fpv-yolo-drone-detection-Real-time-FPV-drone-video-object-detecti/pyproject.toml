[project]
name = "fpv-yolo-drone-detection"
version = "0.1.0"
description = "Real-time FPV/drone video object detection using YOLO and OpenCV with Jetson deployment notes."
requires-python = ">=3.10"
readme = "README.md"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
