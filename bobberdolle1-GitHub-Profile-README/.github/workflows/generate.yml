name: Rebuild profile assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_assets.js"
      - ".github/workflows/generate.yml"

permissions:
  contents: write

concurrency:
  group: generate-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render SVGs from live GitHub data
        env:
          # The contributions calendar is a GraphQL-only field. GITHUB_TOKEN
          # reads it fine for public contributions; set a GH_PAT with read:user
          # if private contributions should be counted too.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node generate_assets.js

      - name: Commit if the field changed
        # README.md is included because the generator rewrites the clickable
        # card grid between its projects:start/end markers.
        run: |
          # git diff --quiet misses newly created files; status --porcelain
          # catches modified and untracked alike.
          if [ -z "$(git status --porcelain -- assets/ README.md)" ]; then
            echo "no change — same data as the last run"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git commit -m "chore: rebuild profile assets"
          git pull --rebase origin main
          git push
