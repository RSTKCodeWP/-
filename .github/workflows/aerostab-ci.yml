name: AeroStab CI

on:
  push:
    paths:
      - 'AeroStab/**'
      - '.github/workflows/aerostab-ci.yml'
  pull_request:
    paths:
      - 'AeroStab/**'
      - '.github/workflows/aerostab-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AeroStab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Triple verification (unit + integration + E2E)
        run: bash scripts/verify_all.sh
