name: AeroStab CI

on:
  push:
    paths:
      - 'AeroStab/**'
      - '.github/workflows/aerostab-ci.yml'
  pull_request:
    paths:
      - 'AeroStab/**'
      - '.github/workflows/aerostab-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AeroStab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        run: python -m pytest -q

      - name: SITL HIL integration
        run: python scripts/sitl_hil.py --seconds 5

      - name: SITL scenarios
        run: python scripts/sitl_scenarios.py

      - name: Simulation smoke test
        run: python scripts/simulate.py

      - name: Analyze sample log
        run: |
          python scripts/simulate.py
          python scripts/analyze_log.py -d logs --json | head -20
