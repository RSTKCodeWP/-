name: FPV Library Sync

on:
  schedule:
    # Daily at 06:00 UTC — discover, triage, full mirror sync
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      keyword_batch:
        description: "Keywords per run (rotating from keywords.txt)"
        required: false
        default: "12"
      discover_pages:
        description: "Search pages per keyword (e.g. 1 or 1-2)"
        required: false
        default: "1"
      min_score:
        description: "Minimum relevance score"
        required: false
        default: "2.0"
      backfill_per_run:
        description: "New keep repos to clone per run (gradual backfill)"
        required: false
        default: "25"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Keyword discovery (rotating batch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 fpv-library/scripts/discover_keywords.py \
            --pages "${{ github.event.inputs.discover_pages || '1' }}" \
            --min-score "${{ github.event.inputs.min_score || '2.0' }}" \
            --batch-size "${{ github.event.inputs.keyword_batch || '12' }}" \
            --expand-owners \
            --owner-limit 0

      - name: Expand from catalog base (owners, orgs, similarity)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 fpv-library/scripts/discover_expand.py \
            --owner-batch 12 \
            --org-batch 5 \
            --similar-batch 8

      - name: Themed discovery (weekly slice — pages 1 only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 fpv-library/scripts/discover_themes.py \
            --pages 1 \
            --min-score 2.5 \
            --owner-limit 5

      - name: Triage catalog and write HOOKS.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 fpv-library/scripts/triage_catalog.py --force

      - name: Register root-level project folders
        run: python3 fpv-library/scripts/register_legacy.py

      - name: Discover org libraries (OpenIPC full copy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 fpv-library/scripts/discover_org.py --org OpenIPC --verdict keep

      - name: Install Git LFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          git lfs install

      - name: Daily mirror — update existing + backfill new keep repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 fpv-library/scripts/sync_daily.py \
            --backfill-per-run "${{ github.event.inputs.backfill_per_run || '25' }}"

      - name: Check Caddx Ground Configuration releases
        run: python3 fpv-library/scripts/sync_caddx_ground_config.py --check-only

      - name: Funnel discovery (broad drone queries + owner expand)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 fpv-library/scripts/discover_funnel.py --pages 1 --owner-limit 15 --min-score 1.8 || true
          python3 fpv-library/scripts/triage_catalog.py --force

      - name: Regenerate REPOS.md index
        run: python3 fpv-library/scripts/generate_repo_index.py

      - name: Regenerate MAP.md (folder tree)
        run: python3 fpv-library/scripts/generate_library_map.py

      - name: Regenerate exhibition wiki
        run: python3 fpv-library/scripts/generate_wiki.py

      - name: Commit updates
        run: |
          git config user.name "fpv-library-bot"
          git config user.email "fpv-library-bot@users.noreply.github.com"
          git add fpv-library/ REPOS.md MAP.md wiki/ docs/MIRROR_POLICY.md docs/STRUCTURE.md .gitmodules
          # Org/user mirror folders at monorepo root (e.g. OpenIPC/firmware)
          python3 - <<'PY' | while read -r d; do [ -n "$d" ] && git add "$d/"; done
          import json
          from pathlib import Path
          catalog = json.loads(Path("fpv-library/catalog.json").read_text(encoding="utf-8"))
          roots = set()
          for e in catalog.get("repos", []):
              p = e.get("path") or ""
              if p.startswith("fpv-library/"):
                  continue
              if "/" in p:
                  roots.add(p.split("/")[0])
          for r in sorted(roots):
              if Path(r).is_dir():
                  print(r)
          PY
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fpv-library: daily discover, triage, and full-git mirror sync"
            git push
          fi
