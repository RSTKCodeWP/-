<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password</title>
  <style>
    html, body { height:100%; margin:0; background:#15170b; color:#e5e7eb; font-family:'Consolas','Lucida Console','Roboto Mono',monospace; }
    .container { display:flex; justify-content:center; align-items:center; height:100%; padding:1rem; }
    .panel { width:100%; max-width:420px; }
    .prompt { display:flex; flex-direction:column; gap:0.75rem; }
    .field { position:relative; display:flex; align-items:stretch; }
    .field input[type="password"], .field input[type="text"]{
      flex:1 1 auto; padding:0.5rem 2.4rem 0.5rem 0.75rem; font-size:1rem;
      border:1px solid #5D6532; border-radius:6px; outline:none;
      background:#3D4221; color:#e5e7eb;
    }
    .eye-btn{
      position:absolute; right:0.25rem; top:50%; transform:translateY(-50%);
      border:none; background:transparent; cursor:pointer; padding:0.35rem; line-height:0;
    }
    .eye-btn svg{ width:20px; height:20px; }
    .actions{ display:flex; gap:0.5rem; justify-content:flex-end; margin-top:0.25rem; flex-wrap:wrap; }
    .btn{ padding:0.5rem 1.2rem; font-size:1rem; border:none; border-radius:6px; cursor:pointer; }
    .btn-ok{ background:#AFBD5E; color:#0e1006; }
    .btn-ok:disabled{ background:#c7c7c7; color:#6b6b6b; cursor:not-allowed; }
    .btn-cancel{ background:#232613; color:#e5e7eb; border:1px solid #3e4522; }
    .btn-remove{ background:#C06100; color:#fff; }
    .hint{ font-size:0.9rem; color:#b5be97; min-height:1.2em; }
    .hint.error{ color:#ffb4b4; }
    .hint.ok{ color:#AFBD5E; }
    .result{ font-size:1.1rem; text-align:center; }
    .result.ok{ color:#AFBD5E; }
    .result.removed{ color:#C06100; }
  </style>
</head>
<body>
  <div class="container">
    <form id="form" class="panel" onsubmit="event.preventDefault(); submitChange();">
      <div class="prompt">
        <div class="field">
          <input type="password" id="pwd1" placeholder="New password" autocomplete="new-password" autofocus>
          <button type="button" class="eye-btn" data-target="pwd1" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M12 5C5 5 1 12 1 12s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></button>
        </div>
        <div class="field">
          <input type="password" id="pwd2" placeholder="Confirm password" autocomplete="new-password">
          <button type="button" class="eye-btn" data-target="pwd2" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M12 5C5 5 1 12 1 12s4 7 11 7 11-7 11-7-4-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></button>
        </div>
        <div id="hint" class="hint"></div>
        <div class="actions">
          <button type="button" class="btn btn-remove" onclick="removePassword()">Remove</button>
          <button type="button" class="btn btn-cancel" onclick="window.history.back()">Cancel</button>
          <button id="okBtn" type="submit" class="btn btn-ok" disabled>OK</button>
        </div>
      </div>
    </form>
    <div id="result" class="result" style="display:none"></div>
  </div>

  <script>
    // Simple md5 (short variant from previous answer)
    !function(n){"use strict";function d(n,t){var r=(65535&n)+(65535&t);return(n>>16)+(t>>16)+(r>>16)<<16|65535&r}function f(n,t,r,e,o,u){return d((u=d(d(t,n),d(e,u)))<<o|u>>>32-o,r)}function l(n,t,r,e,o,u,c){return f(t&r|~t&e,n,t,o,u,c)}function g(n,t,r,e,o,u,c){return f(t&e|r&~e,n,t,o,u,c)}function v(n,t,r,e,o,u,c){return f(t^r^e,n,t,o,u,c)}function m(n,t,r,e,o,u,c){return f(r^(t|~e),n,t,o,u,c)}function c(n,t){var r,e,o,u;n[t>>5]|=128<<t%32,n[14+(t+64>>>9<<4)]=t;for(var c=1732584193,f=-271733879,i=-1732584194,a=271733878,h=0;h<n.length;h+=16)c=l(r=c,e=f,o=i,u=a,n[h],7,-680876936),a=l(a,c,f,i,n[h+1],12,-389564586),i=l(i,a,c,f,n[h+2],17,606105819),f=l(f,i,a,c,n[h+3],22,-1044525330),c=l(c,f,i,a,n[h+4],7,-176418897),a=l(a,c,f,i,n[h+5],12,1200080426),i=l(i,a,c,f,n[h+6],17,-1473231341),f=l(f,i,a,c,n[h+7],22,-45705983),c=l(c,f,i,a,n[h+8],7,1770035416),a=l(a,c,f,i,n[h+9],12,-1958414417),i=l(i,a,c,f,n[h+10],17,-42063),f=l(f,i,a,c,n[h+11],22,-1990404162),c=l(c,f,i,a,n[h+12],7,1804603682),a=l(a,c,f,i,n[h+13],12,-40341101),i=l(i,a,c,f,n[h+14],17,-1502002290),c=g(c,f=l(f,i,a,c,n[h+15],22,1236535329),i,a,n[h+1],5,-165796510),a=g(a,c,f,i,n[h+6],9,-1069501632),i=g(i,a,c,f,n[h+11],14,643717713),f=g(f,i,a,c,n[h],20,-373897302),c=g(c,f,i,a,n[h+5],5,-701558691),a=g(a,c,f,i,n[h+10],9,38016083),i=g(i,a,c,f,n[h+15],14,-660478335),f=g(f,i,a,c,n[h+4],20,-405537848),c=g(c,f,i,a,n[h+9],5,568446438),a=g(a,c,f,i,n[h+14],9,-1019803690),i=g(i,a,c,f,n[h+3],14,-187363961),f=g(f,i,a,c,n[h+8],20,1163531501),c=g(c,f,i,a,n[h+13],5,-1444681467),a=g(a,c,f,i,n[h+2],9,-51403784),i=g(i,a,c,f,n[h+7],14,1735328473),c=v(c,f=g(f,i,a,c,n[h+12],20,-1926607734),i,a,n[h+5],4,-378558),a=v(a,c,f,i,n[h+8],11,-2022574463),i=v(i,a,c,f,n[h+11],16,1839030562),f=v(f,i,a,c,n[h+14],23,-35309556),c=v(c,f,i,a,n[h+1],4,-1530992060),a=v(a,c,f,i,n[h+4],11,1272893353),i=v(i,a,c,f,n[h+7],16,-155497632),f=v(f,i,a,c,n[h+10],23,-1094730640),c=v(c,f,i,a,n[h+13],4,681279174),a=v(a,c,f,i,n[h],11,-358537222),i=v(i,a,c,f,n[h+3],16,-72252     const pwd1=document.getElementById('pwd1');
    const pwd2=document.getElementById('pwd2');
    const okBtn=document.getElementById('okBtn');
    const hint=document.getElementById('hint');
    const form=document.getElementById('form');
    const result=document.getElementById('result');

    function validate(){
      const a=pwd1.value,b=pwd2.value;
      if(!a&&!b){hint.textContent=''; okBtn.disabled=true; return;}
      if(a.length>0 && a.length<4){hint.textContent='Use at least 4 characters.'; hint.className='hint error'; okBtn.disabled=true; return;}
      if(a!==b){hint.textContent='Passwords do not match.'; hint.className='hint error'; okBtn.disabled=true; return;}
      hint.textContent='Passwords match.'; hint.className='hint ok'; okBtn.disabled=false;
    }
    pwd1.addEventListener('input',validate);
    pwd2.addEventListener('input',validate);

    document.querySelectorAll('.eye-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const id=btn.dataset.target;
        const input=document.getElementById(id);
        input.type=input.type==='password'?'text':'password';
      });
    });

    function setBusy(isBusy){
    document.querySelectorAll('.btn, .eye-btn, input').forEach(el => el.disabled = isBusy);
  }
  function showMessage(text, css = "result"){
    form.style.display = "none";
    result.textContent = text;
    result.className = css;
    result.style.display = "block";
    setTimeout(() => { window.location.assign('/'); }, 3000);
  }

  async function submitChange(){
    if(okBtn.disabled) return;
    const hash = md5(pwd1.value);
    setBusy(true);
    try {
      const res = await fetch(`/setpass/${hash}`, { method: 'GET', credentials: 'same-origin' });
      const serverText = await res.text(); // plain text
      showMessage(res.ok ? (serverText || "Password successfully set.") : (`Failed: ${serverText || res.status}`),
                  res.ok ? "result ok" : "result");
    } catch (e) {
      showMessage("Network error while setting password.", "result");
    } finally {
      setBusy(false);
    }
  }

  async function removePassword(){
    setBusy(true);
    try {
      const res = await fetch(`/removepass`, { method: 'GET', credentials: 'same-origin' });
      const serverText = await res.text(); // plain text
      showMessage(res.ok ? (serverText || "Password removed.") : (`Failed: ${serverText || res.status}`),
                  res.ok ? "result removed" : "result");
    } catch (e) {
      showMessage("Network error while removing password.", "result");
    } finally {
      setBusy(false);
    }
  }
  </script>
</body>
</html>
