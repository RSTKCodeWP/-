        margin: 1em auto;
        width: 90%;
    }

        width: 100%;

<a href="#" onclick="sendRequest('/pause_resume'); return false;">⏯</a>&nbsp;&nbsp;
<a href="#" onclick="sendRequest('/rewind/1'); return false;">⇨</a>&nbsp;&nbsp;

<!-- Slider to jump to a specific image -->
<div id="sliderContainer">
    <input type="range" id="slideSlider" min="0" max="1000" value="0" oninput="slideTo(this.value)">
</div>

<script>
    let manualSliding = false;

    // Update slider every 500 ms
    setInterval(() => {
        if (!manualSliding) {
            fetch('/current_position')
                .then(res => res.text())
                .then(pos => {
                    console.log('pos: ', pos);
                    document.getElementById("slideSlider").value = pos;
                });
        }
    }, 500);

    const slider = document.getElementById("slideSlider");

    slider.addEventListener("mousedown", () => {
        manualSliding = true;
        sendRequest('/pause'); 
    });

    slider.addEventListener("mouseup", () => {
        manualSliding = false;
        slideTo(slider.value);
    });

    slider.addEventListener("touchstart", () => {
        manualSliding = true;
        sendRequest('/pause'); 
    });

    slider.addEventListener("touchend", () => {
        manualSliding = false;
        slideTo(slider.value);
    });


    let current_position = 0;
    function sendRequest(url) {
        return fetch(url, {
            method: 'GET' // or 'POST' if you need to send a POST request
        })
        .then(response => {
            if (response.ok) {
                let res = response.text();
                //console.log(res)
                return res; // Return the response as plain text
            } else {
                console.error('Request failed:', response.statusText);
                return null;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            return null;
        });
    }

    function slideTo(position) {
        console.log('position: ', position);
        sendRequest('/slide_to/' + position);
    }

    // Optional: dynamically set the slider max via JS (e.g., if you fetch total slides)
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById("slideSlider").max = TOTAL_SLIDES;
    });
</script>
