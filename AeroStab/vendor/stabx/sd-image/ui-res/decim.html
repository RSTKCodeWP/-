<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Decim Viewer</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
    img { max-width: 100%; max-height: 100%; display: block; background: #000; }
    .hud { position: fixed; top: 8px; left: 10px; color: #0f0; font: 12px/1.2 monospace; }
  </style>
  <script>
    (() => {
      const qs = new URLSearchParams(location.search);
      const delayMs = Number(qs.get('delay')) || 0; // optional pause between frames
      const retryMs = Number(qs.get('retry')) || 500; // retry after error
      let running = true;
      let counter = 0;

      function formatNow(){
        const d = new Date();
        return d.toLocaleTimeString();
      }

      window.addEventListener('visibilitychange', () => {
        running = !document.hidden;
        if (running) next();
      });

      function next(){
        if (!running) return;
        const img = document.getElementById('frame');
        const t0 = performance.now();
        img.onload = () => {
          counter++;
          const dt = (performance.now() - t0).toFixed(0);
          const hud = document.getElementById('hud');
          if (hud) hud.textContent = `#${counter} ${formatNow()} load ${dt} ms`;
          if (delayMs > 0) setTimeout(next, delayMs); else next();
        };
        img.onerror = () => {
          const hud = document.getElementById('hud');
          if (hud) hud.textContent = `error; retrying in ${retryMs} ms`;
          setTimeout(next, retryMs);
        };
        // cache-bust to avoid reusing the same image
        img.src = `/decim?ts=${Date.now()}`;
      }

      window.addEventListener('load', next);
    })();
  </script>
</head>
<body>
  <div id="wrap">
    <img id="frame" alt="/decim stream" src="">
  </div>
  <div id="hud" class="hud"></div>
</body>
</html>
