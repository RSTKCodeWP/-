[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerostab"
version = "0.4.0"
description = "GPS-free optical navigation for ArduPilot (Pi Zero 2W + Frank S01)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21.0",
    "opencv-python-headless>=4.5.0",
    "pymavlink>=2.4.37",
    "pyyaml>=6.0",
    "flask>=2.0.0",
    "waitress>=2.1.0",
]

[project.optional-dependencies]
pi = ["picamera2>=0.3.12"]
sensors = ["pmw3901>=1.0.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
aerostab = "aerostab.__main__:main"
aerostab-analyze = "aerostab.log_analyzer:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aerostab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
