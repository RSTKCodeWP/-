[tool.poetry]
name = "terraforge-studio"
version = "2.0.0"
description = "Professional cross-platform 3D terrain and real-world map generator for Unreal Engine 5, Unity, and other game engines"
authors = ["TerraForge Team <contact@terraforge.dev>"]
readme = "README.md"
license = "MIT"
packages = [{include = "realworldmapgen"}]

# Core dependencies: the API, the key-free SRTM elevation source and the
# Unreal/Unity exporters all work with just these. Heavier capabilities are
# offered as extras below so a default install stays small and portable.
[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# Web Framework
fastapi = ">=0.115.0,<1.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0,<1.0"}
pydantic = "^2.9"
pydantic-settings = "^2.6"
email-validator = "^2.0"
python-multipart = ">=0.0.17,<0.1"
aiofiles = ">=24.1.0,<25.0"
httpx = ">=0.27.0,<1.0"

# Scientific Computing
numpy = ">=1.26,<3.0"
scipy = ">=1.11,<2.0"
pillow = ">=10.0,<13.0"

# Utilities
requests = "^2.32"
python-dotenv = "^1.0"
tqdm = "^4.66"
cryptography = ">=42.0,<47.0"
psutil = ">=5.9,<8.0"

# --- Optional extras ---
# GLTF / GeoTIFF export
trimesh = {version = "^4.0", optional = true}
pygltflib = {version = "^1.16", optional = true}
rasterio = {version = "^1.3", optional = true}
# OpenStreetMap vector data
osmnx = {version = "^2.0", optional = true}
geopandas = {version = "^1.0", optional = true}
shapely = {version = "^2.0", optional = true}
pyproj = {version = "^3.7", optional = true}
networkx = {version = "^3.4", optional = true}
# Premium data providers
sentinelhub = {version = "^3.10", optional = true}
earthengine-api = {version = ">=0.1.387", optional = true}
azure-maps-geolocation = {version = "^1.0.0b1", optional = true}
azure-maps-render = {version = "^1.0.0b1", optional = true}
# AI terrain analysis
ollama = {version = "^0.4", optional = true}

[tool.poetry.extras]
export3d = ["trimesh", "pygltflib", "rasterio"]
osm = ["osmnx", "geopandas", "shapely", "pyproj", "networkx"]
premium = ["sentinelhub", "earthengine-api", "azure-maps-geolocation", "azure-maps-render"]
ai = ["ollama"]
all = [
    "trimesh", "pygltflib", "rasterio",
    "osmnx", "geopandas", "shapely", "pyproj", "networkx",
    "sentinelhub", "earthengine-api", "azure-maps-geolocation", "azure-maps-render",
    "ollama",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = ">=0.24"
pytest-cov = ">=5.0"
black = "^24.10"
ruff = ">=0.7"
mypy = "^1.13"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit rule selection keeps CI results stable across ruff releases.
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, C4: comprehensions.
select = ["E", "W", "F", "I", "B", "C4"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI's Depends()/Query() defaults are function calls by design
]

[tool.ruff.lint.per-file-ignores]
# Re-exports in package __init__ files are intentional.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Browser-driven tests live in tests/e2e and need a running app, so they are
# not part of the default run.
addopts = "--ignore=tests/e2e -m 'not network'"
markers = [
    "network: test requires outbound internet access (deselected by default)",
]
