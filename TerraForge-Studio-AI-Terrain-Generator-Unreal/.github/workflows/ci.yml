name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Backend: lint + tests
  # ---------------------------------------------------------------------
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        # The heavy geospatial extras (rasterio, geopandas, osmnx, earth-engine)
        # are optional at runtime and are not needed by the test suite, so CI
        # installs only what the tests import.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.115" "uvicorn[standard]>=0.32" \
            "pydantic>=2.9" "pydantic-settings>=2.6" "email-validator>=2.0" \
            python-multipart aiofiles httpx requests \
            numpy scipy pillow cryptography python-dotenv tqdm psutil \
            pytest pytest-asyncio pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check realworldmapgen cli tests

      - name: Tests
        run: pytest --cov=realworldmapgen --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
        continue-on-error: true

  # ---------------------------------------------------------------------
  # Backend: live check against the public terrain-tile service
  # ---------------------------------------------------------------------
  backend-network:
    name: Backend (live elevation source)
    runs-on: ubuntu-latest
    # Network-dependent, so it must never block a pull request on an outage.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.9" "pydantic-settings>=2.6" httpx numpy scipy pillow pytest pytest-asyncio

      - name: Verify real elevation data can be fetched
        run: pytest tests/test_srtm_source.py -m network -o addopts=""

  # ---------------------------------------------------------------------
  # Frontend: lint + types + unit tests + build
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-new
        run: npm ci

      - name: Lint
        working-directory: ./frontend-new
        run: npm run lint

      - name: Type check
        working-directory: ./frontend-new
        run: npm run type-check

      - name: Unit tests
        working-directory: ./frontend-new
        run: npm run test -- --run

      - name: Build
        working-directory: ./frontend-new
        run: npm run build

  # ---------------------------------------------------------------------
  # Security scan
  # ---------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ---------------------------------------------------------------------
  # Docker image (main branch only, requires registry credentials)
  # ---------------------------------------------------------------------
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check registry credentials
        id: creds
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DOCKER_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKER_USERNAME is not configured - building without pushing"
          fi

      - name: Login to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.creds.outputs.available == 'true' }}
          tags: terraforge/backend:latest,terraforge/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
