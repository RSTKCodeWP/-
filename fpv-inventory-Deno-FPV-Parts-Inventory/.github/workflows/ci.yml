name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - name: Check formatting
        run: deno fmt --check

      - name: Type check
        run: deno task check

      - name: Run tests
        run: deno test --allow-all
