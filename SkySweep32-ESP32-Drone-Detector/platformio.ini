[platformio]
default_envs = esp32dev_standard

[env]
; Pin to the 6.x line (arduino-esp32 2.0.x / IDF 4.4). This firmware relies on
; IDF 4.4 APIs (legacy driver/adc.h, esp_task_wdt_init(timeout, panic)) that were
; removed/changed in espressif32 7.x (core 3.x), so the caret keeps builds
; reproducible without silently jumping to an incompatible major.
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

lib_deps = 
    olikraus/U8g2@^2.35.9
    SPI
    Wire
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    mikalhart/TinyGPSPlus@^1.0.3
    jgromes/RadioLib@^6.6.0
    mprograms/QMC5883LCompass
    eloquentarduino/EloquentTinyML

; ============================================================================
; ENVIRONMENTS FOR AUTOMATED RELEASE BUILDS
; ============================================================================

[env:esp32dev_base]
build_flags = -DTIER_BASE

[env:esp32dev_standard]
build_flags = -DTIER_STANDARD

[env:esp32dev_pro]
build_flags = -DTIER_PRO
; To enable optional modules, add them here:
; build_flags = -DTIER_PRO -DMODULE_ACOUSTIC -DENABLE_COUNTERMEASURES -DMODULE_COMPASS -DMODULE_ML -DMODULE_ATAK

; ----------------------------------------------------------------------------
; Compile-only coverage for the optional modules (ATAK, Compass, Acoustic, GPS).
; These code paths ship in the repo but are not part of any release tier, so
; without this env they were never compiled in CI and could rot silently.
; LoRa is intentionally omitted because the I2S microphone (Acoustic) shares
; GPIO 14/12 with the LoRa module — this env avoids that runtime conflict while
; still exercising every conditional block in main.cpp.
; ----------------------------------------------------------------------------
[env:esp32dev_full]
build_flags =
    -DTIER_STANDARD
    -DMODULE_GPS
    -DMODULE_ATAK
    -DMODULE_COMPASS
    -DMODULE_ACOUSTIC
