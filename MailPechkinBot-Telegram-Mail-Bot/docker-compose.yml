version: '3.8'

services:
  mailpechkinbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailpechkinbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Монтируем директорию для сохранения базы данных
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Опционально: можно добавить healthcheck
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
