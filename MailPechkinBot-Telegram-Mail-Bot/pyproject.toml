[tool.poetry]
name = "mailpechkinbot"
version = "1.0.0"
description = "Продвинутый Telegram-бот для работы с временной почтой"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "*.py"}]

[tool.poetry.dependencies]
python = "^3.11"
python-telegram-bot = "^21.0"
aiohttp = "^3.11.0"
python-dotenv = "^1.0.0"
qrcode = "^7.4.2"
Pillow = "^11.0.0"
apscheduler = "^3.10.4"

[tool.poetry.group.dev.dependencies]
# Добавьте dev-зависимости при необходимости

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "bot:main"
